name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
        ink-version: [6]
        include:
          # Compatibility leg: verify the advertised `ink >=6` peer range
          # against the current ink major.
          - node-version: 22
            ink-version: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save ink@^7
        if: matrix.ink-version == 7
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test
      # Coverage report (one leg is enough; keeps the matrix fast)
      - run: npm run coverage
        if: matrix.node-version == 22 && matrix.ink-version == 6

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # xo requires Node >=20.19 and is unreliable on older 20.x.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
