name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Release-please PRs are opened with GITHUB_TOKEN, which does not trigger
  # pull_request runs; release.yml dispatches this workflow on the PR branch instead.
  workflow_dispatch:

jobs:
  ci:
    # Shared lint + build + typecheck + test matrix for all the Ink libraries.
    uses: costajohnt/ink-config/.github/workflows/ci.yml@v1
