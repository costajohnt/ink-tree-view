name: Release
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # dispatch CI on the release PR branch
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node
      # GITHUB_TOKEN-created PRs get no pull_request CI run, but workflow_dispatch
      # always creates one. Its checks attach to the PR head SHA.
      - name: Run CI on the release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Step env is evaluated even when `if` is false, so fromJSON('') here
          # would fail the job on every push without a release PR. Parse in shell.
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: gh workflow run ci.yml --ref "$(jq -r .headBranchName <<<"$PR_JSON")"

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) needs npm >= 11.5.1
      - run: npm install -g npm@^11
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
